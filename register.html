<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FarmLink - Create Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header class="topbar">

        <div class="brand">
            FarmLink
        </div>


        <nav class="menu">

            <a href="index.html">
                Home
            </a>


            <a href="marketplace.html">
                Marketplace
            </a>


            <a href="post-listing.html">
                Post Listing
            </a>


            <a href="profile.html">
                Profile
            </a>


            <a href="developers.html">
                Developers
            </a>


            <a
                href="login.html"
                class="cta"
            >
                Login / Register
            </a>

        </nav>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="container">


        <div class="auth-card card">


            <h2>
                Create Your Account 🌱
            </h2>


            <p class="muted">

                Join FarmLink and connect
                directly with farmers and buyers.

            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <label for="registerName">

                    Full Name

                </label>


                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="registerEmail">

                    Email Address

                </label>


                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="registerPassword">

                    Password

                </label>


                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <!-- ROLE -->

                <label for="registerRole">

                    Account Type

                </label>


                <select
                    id="registerRole"
                    required
                >

                    <option value="">

                        Select account type

                    </option>


                    <option value="farmer">

                        Farmer

                    </option>


                    <option value="buyer">

                        Buyer

                    </option>

                </select>


                <!-- BUTTONS -->

                <div class="row">


                    <button
                        type="submit"
                        class="btn"
                    >

                        Create Account

                    </button>


                    <a
                        href="login.html"
                        class="btn outline"
                    >

                        Already have an account?

                    </a>

                </div>


                <!-- REGISTER STATUS -->

                <div
                    id="registerStatus"
                    class="status"
                ></div>


            </form>


        </div>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 FarmLink.

        Connecting Farmers Directly With Buyers.

        <br><br>

        Developed by
        <strong>Shrutika Sonmale</strong>

    </footer>


    <!-- ================= APP.JS ================= -->

    <script
        type="module"
        src="app.js"
    ></script>


</body>

</html>
