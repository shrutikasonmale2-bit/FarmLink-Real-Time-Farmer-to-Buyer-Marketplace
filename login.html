<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FarmLink - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header class="topbar">

        <div class="brand">
            FarmLink
        </div>


        <nav class="menu">

            <a href="index.html">
                Home
            </a>


            <a href="marketplace.html">
                Marketplace
            </a>


            <a href="post-listing.html">
                Post Listing
            </a>


            <a href="profile.html">
                Profile
            </a>


            <a href="developers.html">
                Developers
            </a>


            <a
                href="login.html"
                class="cta"
            >
                Login / Register
            </a>

        </nav>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="container">


        <div class="auth-card card">


            <h2>
                Welcome Back 👋
            </h2>


            <p class="muted">

                Login to continue using FarmLink.

            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <label for="loginEmail">

                    Email Address

                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="loginPassword">

                    Password

                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- LOGIN BUTTON -->

                <div class="row">


                    <button
                        type="submit"
                        class="btn"
                    >

                        Login

                    </button>


                    <a
                        href="register.html"
                        class="btn outline"
                    >

                        Create Account

                    </a>

                </div>


                <!-- LOGIN STATUS -->

                <div
                    id="loginStatus"
                    class="status"
                ></div>


            </form>


        </div>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 FarmLink.

        Connecting Farmers Directly With Buyers.

        <br><br>

        Developed by
        <strong>Shrutika Sonmale</strong>

    </footer>


    <!-- ================= APP.JS ================= -->

    <script
        type="module"
        src="app.js"
    ></script>


</body>

</html>
